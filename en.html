    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var t = Math.max(0, Date.now() - since);
      cells.d.textContent = pad(Math.floor(t / 86400000));
      cells.h.textContent = pad(Math.floor(t / 3600000) % 24);
      cells.m.textContent = pad(Math.floor(t / 60000) % 60);
    }
    tick();
    var timer = setInterval(tick, 250);

    // Phones: make the count-up line exactly as wide as "Kirsika & Kjell"
    function fitCount() {
      var row = document.querySelector('.gate__since');
      var names = document.querySelector('.gate__names');
      row.style.fontSize = '';
      if (window.innerWidth >= 700) return;
      var range = document.createRange();
      range.selectNodeContents(names);
      var target = range.getBoundingClientRect().width;
      var left = Infinity, right = -Infinity;
      row.querySelectorAll('.gate__label, .countdown__cell').forEach(function (el) {
        var b = el.getBoundingClientRect();
        left = Math.min(left, b.left);
        right = Math.max(right, b.right);
      });
      var base = parseFloat(getComputedStyle(row).fontSize);
      if (right > left) row.style.fontSize = (base * target / (right - left)) + 'px';
    }
    fitCount();
    window.addEventListener('resize', fitCount);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCount);

    // Fade sections in as they scroll into view
    function initReveal() {
      var els = document.querySelectorAll('[data-reveal]');
      if (!('IntersectionObserver' in window) ||
          window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        els.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { rootMargin: '0px 0px -10% 0px', threshold: 0.08 });
      els.forEach(function (el) { io.observe(el); });
    }

    // Password: decrypts the page content (AES-GCM, key from PBKDF2)
    function bytes(b64) {
      return Uint8Array.from(atob(b64), function (ch) { return ch.charCodeAt(0); });
    }
    function decrypt(password) {
      var p = JSON.parse(document.getElementById('locked').textContent);
      var pw = new TextEncoder().encode(password.trim().toUpperCase());
      return crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: bytes(p.salt), iterations: p.iter, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        })
        .then(function (key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(p.iv) }, key, bytes(p.ct));
        })
        .then(function (buf) { return new TextDecoder().decode(buf); });
    }

    // Tabs inside the page: #photos and #schedule
    function initTabs() {
      var views = site.querySelectorAll('[data-view]');
      var tabs = site.querySelectorAll('[data-tab]');
      function go(name) {
        if (!site.querySelector('[data-view="' + name + '"]')) name = 'photos';
        views.forEach(function (v) {
          v.hidden = v.getAttribute('data-view') !== name;
        });
        tabs.forEach(function (t) {
          if (t.getAttribute('data-tab') === name) t.setAttribute('aria-current', 'page');
          else t.removeAttribute('aria-current');
        });
        window.scrollTo(0, 0);
        initReveal();
      }
      window.addEventListener('hashchange', function () { go(location.hash.slice(1)); });
      go(location.hash.slice(1));
      // Switching language keeps the open tab
      site.querySelectorAll('.lang-switch a').forEach(function (a) {
        a.addEventListener('click', function () {
          a.href = a.getAttribute('href').split('#')[0] + location.hash;
        });
      });
    }

    var gate = document.getElementById('gate');
    var site = document.getElementById('site');
    var form = document.getElementById('gate-form');
    var input = document.getElementById('gate-pw');
    var error = document.getElementById('gate-error');
    var enter = document.getElementById('gate-enter');

    function show(html, password) {
      site.innerHTML = html;
      site.hidden = false;
      gate.hidden = true;
      clearInterval(timer);
      var v = gate.querySelector('video');
      if (v) v.pause();
      initTabs();
      // Remember for this browser tab only, so switching language doesn't ask again
      try { sessionStorage.setItem('k2-pw', password); } catch (e) {}
    }

    enter.addEventListener('click', function () {
      enter.hidden = true;
      form.hidden = false;
      input.focus();
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var password = input.value;
      error.textContent = TEXT.busy;
      decrypt(password).then(function (html) {
        show(html, password);
      }, function () {
        error.textContent = TEXT.wrong;
        input.select();
      });
    });

    var saved = null;
    try { saved = sessionStorage.getItem('k2-pw'); } catch (e) {}
    if (saved) decrypt(saved).then(function (html) { show(html, saved); }, function () {});
  })();
</script>

</body>
</html>
